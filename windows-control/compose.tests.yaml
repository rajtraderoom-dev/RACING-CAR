name: racing-speed-control-tests
services:
  test-db:
    image: postgres:17-alpine
    command: ["postgres", "-c", "log_statement=none", "-c", "log_min_error_statement=panic", "-c", "log_error_verbosity=terse", "-c", "log_parameter_max_length_on_error=0"]
    environment:
      POSTGRES_USER: test_owner
      POSTGRES_PASSWORD: isolated-tests-only
    tmpfs: ["/var/lib/postgresql/data:rw"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_owner"]
      interval: 2s
      timeout: 2s
      retries: 30
  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      TEST_OWNER_URL: postgres://test_owner:isolated-tests-only@test-db:5432/postgres
      NO_PROXY: localhost,127.0.0.1,test-db
      no_proxy: localhost,127.0.0.1,test-db
    depends_on:
      test-db: { condition: service_healthy }
